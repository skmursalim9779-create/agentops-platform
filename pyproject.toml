[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops-platform"
version = "0.1.0"
description = "Gateway, tracing, cost tracking and CI-gated evals for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0"]

[project.scripts]
aop = "aop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
